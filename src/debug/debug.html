<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAM Card Debug</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    .debug-section {
      background: white;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
      border-left: 4px solid #2196F3;
    }
    .error {
      border-left-color: #f44336;
      color: #f44336;
    }
    .success {
      border-left-color: #4CAF50;
      color: #4CAF50;
    }
    .warning {
      border-left-color: #ff9800;
      color: #ff9800;
    }
    h2 {
      margin-top: 0;
      color: #333;
    }
    #console {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 15px;
      border-radius: 8px;
      font-family: monospace;
      max-height: 400px;
      overflow-y: auto;
      margin: 10px 0;
    }
    .log-entry {
      margin: 5px 0;
      padding: 5px;
      border-bottom: 1px solid #333;
    }
    .log-error {
      color: #f48771;
    }
    .log-success {
      color: #89d185;
    }
    .log-info {
      color: #9cdcfe;
    }
    .log-warn {
      color: #ff9800;
    }
    button {
      padding: 10px 20px;
      background: #2196F3;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background: #1976D2;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .card-container {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin: 20px 0;
      min-height: 100px;
    }
    tam-card {
      display: block;
      margin: 20px 0;
    }
    ha-card {
      display: block;
    }
    .api-config {
      margin: 15px 0;
      padding: 10px;
      background: #f9f9f9;
      border-radius: 4px;
    }
    .api-config input {
      padding: 8px;
      margin: 5px;
      border: 1px solid #ddd;
      border-radius: 4px;
      width: 300px;
    }
    .api-config label {
      display: block;
      margin: 5px 0;
      font-weight: bold;
    }
    .select-group {
      margin: 10px 0;
    }
    select {
      padding: 8px;
      margin: 5px;
      border: 1px solid #ddd;
      border-radius: 4px;
      min-width: 200px;
    }
  </style>
</head>
<body>
  <h1>🚊 TAM Card Debug Console (API Version)</h1>

  <div class="debug-section">
    <h2>1️⃣ API Configuration</h2>
    <div class="api-config">
      <label for="api-host">API Host:</label>
      <input type="text" id="api-host" placeholder="e.g., http://localhost:8080" value="http://localhost:8080">
      <button id="save-config-btn">Save Configuration</button>
    </div>
  </div>

  <div class="debug-section">
    <h2>2️⃣ Loading Status</h2>
    <div id="load-status">Initializing...</div>
  </div>

  <div class="debug-section">
    <h2>3️⃣ API Tests</h2>
    <button id="test-stops-btn">Test /api/v1/realtime/stops</button>
    <button id="test-passages-btn">Test /api/v1/realtime/passages</button>
    <div id="api-result" style="margin-top: 10px;"></div>
  </div>

  <div class="debug-section">
    <h2>4️⃣ Card Configuration</h2>
    <div class="select-group">
      <label for="stops-select">Select Stop:</label>
      <select id="stops-select" disabled>
        <option value="">Loading stops...</option>
      </select>
    </div>
    <div class="select-group">
      <label for="routes-select">Select Route (Optional):</label>
      <select id="routes-select" disabled>
        <option value="">All routes</option>
      </select>
    </div>
    <div class="select-group">
      <label for="directions-select">Select Direction (Optional):</label>
      <select id="directions-select" disabled>
        <option value="">All directions</option>
      </select>
    </div>
    <button id="render-card-btn" disabled>Render Card (Waiting...)</button>
  </div>

  <div class="debug-section">
    <h2>5️⃣ Card Render Test</h2>
    <div class="card-container" id="card-container">
      Waiting for tam-card to load...
    </div>
  </div>

  <div class="debug-section">
    <h2>6️⃣ Console Log</h2>
    <div id="console"></div>
  </div>

  <script type="module">
    import('http://localhost:5000/tam-card.js').catch(err => console.error('Failed to import tam-card:', err));

    const consoleDiv = document.getElementById('console');
    const originalLog = console.log;
    const originalError = console.error;
    const originalWarn = console.warn;

    let apiHost = localStorage.getItem('tamCardApiHost') || 'http://localhost:8080';
    document.getElementById('api-host').value = apiHost;

    let availableStops = [];
    let availableRoutes = [];
    let availableDirections = [];

    function addLog(message, type = 'info') {
      const entry = document.createElement('div');
      entry.className = `log-entry log-${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      consoleDiv.appendChild(entry);
      consoleDiv.scrollTop = consoleDiv.scrollHeight;
      originalLog(`[TAM-DEBUG] ${message}`);
    }

    console.log = (...args) => addLog(args.join(' '), 'info');
    console.error = (...args) => addLog(args.join(' '), 'error');
    console.warn = (...args) => addLog(args.join(' '), 'warn');

    // Mock Home Assistant object
    window.hassConnected = new Promise(resolve => {
      window.hass = {
        states: {},
        services: {},
        config: { unit_system: { length: 'km' } },
        language: 'en',
        latitude: 43.6108,
        longitude: 3.8767,
      };
      resolve();
    });

    document.getElementById('save-config-btn').addEventListener('click', () => {
      apiHost = document.getElementById('api-host').value;
      localStorage.setItem('tamCardApiHost', apiHost);
      addLog(`✅ Configuration saved: ${apiHost}`, 'success');
    });

    function populateStopsDropdown(stops) {
      const stopSelect = document.getElementById('stops-select');
      stopSelect.innerHTML = '<option value="">Select a stop</option>';
      stops.forEach(stop => {
        const option = document.createElement('option');
        option.value = stop;
        option.textContent = stop;
        stopSelect.appendChild(option);
      });
      stopSelect.disabled = false;
      document.getElementById('render-card-btn').disabled = false;
    }

    function populateRoutesDropdown(routes) {
      const routeSelect = document.getElementById('routes-select');
      routeSelect.innerHTML = '<option value="">All routes</option>';
      routes.forEach(route => {
        const option = document.createElement('option');
        option.value = route;
        option.textContent = `Route ${route}`;
        routeSelect.appendChild(option);
      });
      routeSelect.disabled = false;
    }

    function populateDirectionsDropdown(directions) {
      const directionSelect = document.getElementById('directions-select');
      directionSelect.innerHTML = '<option value="">All directions</option>';
      directions.forEach(direction => {
        const option = document.createElement('option');
        option.value = direction;
        option.textContent = direction;
        directionSelect.appendChild(option);
      });
      directionSelect.disabled = false;
    }

    async function testStopsApi() {
      try {
        addLog('🌐 Testing /api/v1/realtime/stops...', 'info');
        const url = `${apiHost}/api/v1/realtime/stops`;
        addLog(`📍 Requesting: ${url}`, 'info');
        
        const response = await fetch(url, {
          method: 'GET',
          headers: {
            'Accept': 'application/json',
          },
        });
        
        if (!response.ok) {
          addLog(`❌ API Error: ${response.status} ${response.statusText}`, 'error');
          document.getElementById('api-result').innerHTML = `<span class="error">❌ API Error: ${response.status} ${response.statusText}</span>`;
          return;
        }
        
        const data = await response.json();
        addLog(`✅ Stops API working!`, 'success');
        
        // Handle both array and nested data structure
        let stopsArray = Array.isArray(data) ? data : (data.data && Array.isArray(data.data) ? data.data : []);
        
        if (stopsArray.length > 0) {
          // Extract stop names
          const stops = stopsArray.map(stop => stop.Name || stop).filter(Boolean);
          addLog(`✅ Received ${stops.length} stops`, 'success');
          addLog(`Sample stops: ${stops.slice(0, 3).join(', ')}`, 'info');
          availableStops = stops;
          populateStopsDropdown(stops);
          document.getElementById('api-result').innerHTML = `<span class="success">✅ API working! Stops received: ${stops.length}</span>`;
        } else {
          addLog(`⚠️ No stops found in response`, 'warn');
        }
      } catch (e) {
        addLog(`❌ API Error: ${e.message}`, 'error');
        document.getElementById('api-result').innerHTML = `<span class="error">❌ Error: ${e.message}</span>`;
      }
    }

    async function testPassagesApi() {
      try {
        const stopSelect = document.getElementById('stops-select');
        const stop = stopSelect.value;

        if (!stop) {
          addLog('⚠️ Please select a stop first', 'warn');
          return;
        }

        addLog(`🌐 Testing /api/v1/realtime/passages for stop: ${stop}...`, 'info');
        const url = `${apiHost}/api/v1/realtime/passages?stop_name=${encodeURIComponent(stop)}&limit=50`;
        addLog(`📍 Requesting: ${url}`, 'info');
        
        const response = await fetch(url, {
          method: 'GET',
          headers: {
            'Accept': 'application/json',
          },
        });
        
        if (!response.ok) {
          addLog(`❌ API Error: ${response.status} ${response.statusText}`, 'error');
          document.getElementById('api-result').innerHTML = `<span class="error">❌ API Error: ${response.status} ${response.statusText}</span>`;
          return;
        }
        
        const data = await response.json();
        addLog(`✅ Passages API working!`, 'success');
        
        // Handle both array and nested data structure
        let passagesArray = Array.isArray(data) ? data : (data.data && Array.isArray(data.data) ? data.data : []);
        
        if (passagesArray.length > 0) {
          addLog(`✅ Received ${passagesArray.length} passages`, 'success');
          addLog(`Response: ${JSON.stringify(passagesArray[0], null, 2)}`, 'info');
          
          // Extract unique routes
          const routes = [...new Set(passagesArray.map(p => p.route_short_name).filter(Boolean))].sort();
          if (routes.length > 0) {
            availableRoutes = routes;
            populateRoutesDropdown(routes);
            addLog(`Found ${routes.length} unique routes: ${routes.join(', ')}`, 'success');
          }
          
          // Extract unique directions
          const directions = [...new Set(passagesArray.map(p => p.trip_headsign || p.direction).filter(Boolean))].sort();
          if (directions.length > 0) {
            availableDirections = directions;
            populateDirectionsDropdown(directions);
            addLog(`Found ${directions.length} unique directions`, 'success');
          }
          
          document.getElementById('api-result').innerHTML = `<span class="success">✅ API working! Passages received: ${passagesArray.length}</span>`;
        } else {
          addLog(`⚠️ No passages found`, 'warn');
        }
      } catch (e) {
        addLog(`❌ API Error: ${e.message}`, 'error');
        document.getElementById('api-result').innerHTML = `<span class="error">❌ Error: ${e.message}</span>`;
      }
    }

    function renderCard() {
      const stopSelect = document.getElementById('stops-select');
      const routeSelect = document.getElementById('routes-select');
      const directionSelect = document.getElementById('directions-select');
      
      const stop = stopSelect.value;
      const route = routeSelect.value;
      const direction = directionSelect.value;

      if (!stop) {
        addLog('⚠️ Please select a stop', 'warn');
        return;
      }

      const config = {
        type: 'custom:tam-card',
        stop: stop,
        api_host: apiHost,
      };

      if (route) {
        config.route_short_name = route;
      }

      if (direction) {
        config.direction = direction;
      }

      addLog(`🎨 Rendering card with config: ${JSON.stringify(config)}`, 'info');

      const cardContainer = document.getElementById('card-container');
      cardContainer.innerHTML = '';

      const tamCard = document.createElement('tam-card');
      tamCard.setConfig(config);
      tamCard.hass = window.hass;

      cardContainer.appendChild(tamCard);
      addLog(`✅ Card rendered successfully!`, 'success');
    }

    // Event listeners
    document.getElementById('test-stops-btn').addEventListener('click', testStopsApi);
    document.getElementById('test-passages-btn').addEventListener('click', testPassagesApi);
    document.getElementById('render-card-btn').addEventListener('click', renderCard);

    // Initialize
    window.addEventListener('DOMContentLoaded', () => {
      addLog('🚀 TAM Card Debug Console initialized', 'info');
      document.getElementById('load-status').textContent = '✅ Ready to test';
    });
  </script>
</body>
</html>
