<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAM Card Debug</title>
  <script src="https://unpkg.com/lit-element@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    .debug-section {
      background: white;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
      border-left: 4px solid #2196F3;
    }
    .error {
      border-left-color: #f44336;
      color: #f44336;
    }
    .success {
      border-left-color: #4CAF50;
      color: #4CAF50;
    }
    h2 {
      margin-top: 0;
      color: #333;
    }
    #console {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 15px;
      border-radius: 8px;
      font-family: monospace;
      max-height: 400px;
      overflow-y: auto;
      margin: 10px 0;
    }
    .log-entry {
      margin: 5px 0;
      padding: 5px;
      border-bottom: 1px solid #333;
    }
    .log-error {
      color: #f48771;
    }
    .log-success {
      color: #89d185;
    }
    .log-info {
      color: #9cdcfe;
    }
    .log-warn {
      color: #ff9800;
    }
    button {
      padding: 10px 20px;
      background: #2196F3;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background: #1976D2;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .card-container {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin: 20px 0;
      min-height: 100px;
    }
    tam-card {
      display: block;
      margin: 20px 0;
    }
    ha-card {
      display: block;
    }
  </style>
</head>
<body>
  <h1>🚊 TAM Card Debug Console</h1>

  <div class="debug-section">
    <h2>1️⃣ Loading Status</h2>
    <div id="load-status">Initializing...</div>
  </div>

  <div class="debug-section">
    <h2>2️⃣ Tests</h2>
    <button id="test-proxy-btn">Test Proxy Server</button>
    <button id="test-api-btn">Test TAM CSV API</button>
    <button id="render-card-btn" disabled>Render Card (Waiting...)</button>
    <div id="api-result" style="margin-top: 10px;"></div>
  </div>

  <div class="debug-section">
    <h2>3️⃣ Card Render Test</h2>
    <div class="card-container" id="card-container">
      Waiting for tam-card to load...
    </div>
  </div>

  <div class="debug-section">
    <h2>4️⃣ Console Log</h2>
    <div id="console"></div>
  </div>

  <script>
    const consoleDiv = document.getElementById('console');
    const originalLog = console.log;
    const originalError = console.error;
    const originalWarn = console.warn;

    function addLog(message, type = 'info') {
      const entry = document.createElement('div');
      entry.className = `log-entry log-${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      consoleDiv.appendChild(entry);
      consoleDiv.scrollTop = consoleDiv.scrollHeight;
      originalLog(`[TAM-DEBUG] ${message}`);
    }

    console.log = (...args) => addLog(args.join(' '), 'info');
    console.error = (...args) => addLog(args.join(' '), 'error');
    console.warn = (...args) => addLog(args.join(' '), 'warn');

    // Mock Home Assistant object
    const mockHass = {
      states: {},
      entities: {},
      devices: {},
      areas: {},
      services: {},
      config: {
        latitude: 43.61,
        longitude: 3.88,
        elevation: 50,
        unit_system: {
          length: 'km',
          mass: 'kg',
          temperature: '°C',
          volume: 'L',
        },
        time_zone: 'Europe/Paris',
        components: [],
        version: '2023.1.0',
      },
      localize: () => '',
      locale: {
        language: 'fr',
        country: 'FR',
      },
      call_service: () => {},
    };

    let tamCardLoaded = false;

    // Load the card and test
    async function init() {
      try {
        addLog('📦 Loading tam-card.js...', 'info');
        
        const script = document.createElement('script');
        script.src = 'http://localhost:5000/tam-card.js';
        
        script.onerror = (error) => {
          addLog(`❌ Failed to load tam-card.js: ${error}`, 'error');
          document.getElementById('load-status').innerHTML = '<span class="error">❌ Failed to load tam-card.js - Is npm start running on port 5000?</span>';
        };

        script.onload = async () => {
          addLog('✅ tam-card.js loaded successfully', 'success');
          document.getElementById('load-status').innerHTML = '<span class="success">✅ tam-card.js loaded</span>';
          
          // Wait longer for custom element to be registered and all dependencies to load
          addLog('⏳ Waiting 2 seconds for custom element registration...', 'info');
          await new Promise(resolve => setTimeout(resolve, 2000));
          
          try {
            // Check if tam-card is registered
            const tamCardElement = customElements.get('tam-card');
            if (tamCardElement) {
              addLog('✅ tam-card custom element registered!', 'success');
              addLog(`Element class: ${tamCardElement.name}`, 'info');
              tamCardLoaded = true;
              
              // Enable render button
              document.getElementById('render-card-btn').disabled = false;
              document.getElementById('render-card-btn').textContent = 'Render Card';
              document.getElementById('card-container').innerHTML = 'Ready! Click "Render Card" above.';
            } else {
              addLog('❌ tam-card custom element not registered after 2 seconds', 'error');
              
              // Try to debug - list all registered elements
              try {
                const keys = Array.from(customElements).map(el => el.name || el.toString());
                addLog(`Available custom elements: ${keys.join(', ')}`, 'info');
              } catch (e) {
                addLog('Could not enumerate custom elements', 'warn');
              }
              
              // Check for errors in tam-card.js by checking window
              if ((window as any).customCards) {
                addLog(`✅ customCards registered: ${(window as any).customCards.map(c => c.type).join(', ')}`, 'info');
              }
            }
          } catch (e) {
            addLog(`⚠️ Error checking element: ${e.message}`, 'warn');
            addLog(`Stack: ${e.stack}`, 'error');
          }
        };

        document.head.appendChild(script);
      } catch (e) {
        addLog(`Error: ${e.message}`, 'error');
      }
    }

    async function testProxyServer() {
      try {
        addLog('🌐 Testing proxy server health...', 'info');
        const response = await fetch('http://localhost:3001/health', {
          mode: 'cors',
        });
        
        if (!response.ok) {
          addLog(`❌ Proxy Error: ${response.status} ${response.statusText}`, 'error');
          document.getElementById('api-result').innerHTML = `<span class="error">Proxy Error: ${response.status} ${response.statusText}</span>`;
          return;
        }
        
        const data = await response.json();
        addLog('✅ Proxy server is running!', 'success');
        document.getElementById('api-result').innerHTML = `<span class="success">✅ Proxy server is healthy!</span>`;
      } catch (e) {
        addLog(`❌ Proxy Error: ${e.message}`, 'error');
        document.getElementById('api-result').innerHTML = `<span class="error">❌ Proxy Error: ${e.message} - Is node server.js running on port 3001?</span>`;
      }
    }

    async function testTamCsvApi() {
      try {
        addLog('🌐 Testing TAM CSV API via proxy...', 'info');
        const response = await fetch('http://localhost:3001/api/tam-csv', {
          mode: 'cors',
          headers: {
            'Accept': 'text/csv',
          },
        });
        
        if (!response.ok) {
          addLog(`❌ API Error: ${response.status} ${response.statusText}`, 'error');
          document.getElementById('api-result').innerHTML = `<span class="error">API Error: ${response.status} ${response.statusText}</span>`;
          return;
        }
        
        addLog('✅ TAM CSV API is reachable!', 'success');
        const csvText = await response.text();
        const lines = csvText.trim().split('\n');
        addLog(`✅ Received CSV data: ${lines.length} lines`, 'success');
        addLog(`Sample header: ${lines[0]}`, 'info');
        addLog(`Sample row: ${lines[1]}`, 'info');
        document.getElementById('api-result').innerHTML = `<span class="success">✅ API working! CSV Data received: ${lines.length} lines</span>`;
      } catch (e) {
        addLog(`❌ API Error: ${e.message}`, 'error');
        document.getElementById('api-result').innerHTML = `<span class="error">API Error: ${e.message}</span>`;
      }
    }

    function renderCard() {
      try {
        if (!tamCardLoaded) {
          addLog('❌ tam-card is not loaded yet. Wait for the "tam-card custom element registered" message.', 'error');
          return;
        }

        addLog('🎨 Attempting to render tam-card...', 'info');
        
        const container = document.getElementById('card-container');
        container.innerHTML = '';

        // Create the tam-card element
        const card = document.createElement('tam-card');
        
        // Set config first
        const config = {
          type: 'custom:tam-card',
          stop: 'ALBERT 1ER',
          direction: 'GARE SUD FRANCE',
        };
        
        addLog(`Setting card config: stop=${config.stop}, direction=${config.direction}`, 'info');
        
        // Set the hass property BEFORE calling setConfig
        card.hass = mockHass;
        addLog('✅ hass property set', 'success');
        
        // Append to DOM first
        container.appendChild(card);
        addLog('✅ Card appended to DOM', 'success');

        // Now call setConfig
        if (typeof card.setConfig === 'function') {
          addLog('⏳ Calling setConfig...', 'info');
          card.setConfig(config).then(() => {
            addLog('✅ setConfig completed', 'success');
          }).catch(err => {
            addLog(`❌ setConfig error: ${err.message}`, 'error');
            addLog(`Stack: ${err.stack}`, 'error');
          });
        } else {
          addLog('❌ setConfig method not found on element', 'error');
          addLog('Available methods: ' + Object.getOwnPropertyNames(Object.getPrototypeOf(card)).join(', '), 'info');
        }

      } catch (e) {
        addLog(`❌ Error rendering card: ${e.message}`, 'error');
        addLog(`Stack: ${e.stack}`, 'error');
        document.getElementById('card-container').innerHTML = `<span class="error">Error: ${e.message}</span>`;
      }
    }

    document.getElementById('test-proxy-btn').addEventListener('click', testProxyServer);
    document.getElementById('test-api-btn').addEventListener('click', testTamCsvApi);
    document.getElementById('render-card-btn').addEventListener('click', renderCard);

    addLog('🚀 Initializing TAM Card Debugger...', 'info');
    init();
  </script>
</body>
</html>
