<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAM Card Debug</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    .debug-section {
      background: white;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
      border-left: 4px solid #2196F3;
    }
    .error {
      border-left-color: #f44336;
      color: #f44336;
    }
    .success {
      border-left-color: #4CAF50;
      color: #4CAF50;
    }
    .warning {
      border-left-color: #ff9800;
      color: #ff9800;
    }
    h2 {
      margin-top: 0;
      color: #333;
    }
    #console {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 15px;
      border-radius: 8px;
      font-family: monospace;
      max-height: 400px;
      overflow-y: auto;
      margin: 10px 0;
    }
    .log-entry {
      margin: 5px 0;
      padding: 5px;
      border-bottom: 1px solid #333;
    }
    .log-error {
      color: #f48771;
    }
    .log-success {
      color: #89d185;
    }
    .log-info {
      color: #9cdcfe;
    }
    .log-warn {
      color: #ff9800;
    }
    button {
      padding: 10px 20px;
      background: #2196F3;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background: #1976D2;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .card-container {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin: 20px 0;
      min-height: 100px;
    }
    tam-card {
      display: block;
      margin: 20px 0;
    }
    ha-card {
      display: block;
    }
    .api-config {
      margin: 15px 0;
      padding: 10px;
      background: #f9f9f9;
      border-radius: 4px;
    }
    .api-config input {
      padding: 8px;
      margin: 5px;
      border: 1px solid #ddd;
      border-radius: 4px;
      width: 300px;
    }
    .api-config label {
      display: block;
      margin: 5px 0;
      font-weight: bold;
    }
    .select-group {
      margin: 10px 0;
    }
    select {
      padding: 8px;
      margin: 5px;
      border: 1px solid #ddd;
      border-radius: 4px;
      min-width: 200px;
    }
  </style>
</head>
<body>
  <h1>🚊 TAM Card Debug Console (API Version)</h1>

  <div class="debug-section">
    <h2>1️⃣ API Configuration</h2>
    <div class="api-config">
      <label for="api-host">API Host:</label>
      <input type="text" id="api-host" placeholder="e.g., http://localhost:8080" value="http://localhost:8080">
      <button id="save-config-btn">Save Configuration</button>
    </div>
  </div>

  <div class="debug-section">
    <h2>2️⃣ Loading Status</h2>
    <div id="load-status">Initializing...</div>
  </div>

  <div class="debug-section">
    <h2>3️⃣ API Tests</h2>
    <button id="test-stops-btn">Test /api/v1/realtime/stops</button>
    <button id="test-passages-btn">Test /api/v1/realtime/passages</button>
    <div id="api-result" style="margin-top: 10px;"></div>
  </div>

  <div class="debug-section">
    <h2>4️⃣ Card Configuration</h2>
    <div class="select-group">
      <label for="stops-select">Select Stop:</label>
      <select id="stops-select" disabled>
        <option value="">Loading stops...</option>
      </select>
    </div>
    <div class="select-group">
      <label for="directions-select">Select Direction:</label>
      <select id="directions-select" disabled>
        <option value="">Select a stop first</option>
      </select>
    </div>
    <button id="render-card-btn" disabled>Render Card (Waiting...)</button>
  </div>

  <div class="debug-section">
    <h2>5️⃣ Card Render Test</h2>
    <div class="card-container" id="card-container">
      Waiting for tam-card to load...
    </div>
  </div>

  <div class="debug-section">
    <h2>6️⃣ Console Log</h2>
    <div id="console"></div>
  </div>

  <script type="module">
    import('http://localhost:5000/tam-card.js').catch(err => console.error('Failed to import tam-card:', err));

    const consoleDiv = document.getElementById('console');
    const originalLog = console.log;
    const originalError = console.error;
    const originalWarn = console.warn;

    let apiHost = localStorage.getItem('tamCardApiHost') || 'http://localhost:8080';
    document.getElementById('api-host').value = apiHost;

    function addLog(message, type = 'info') {
      const entry = document.createElement('div');
      entry.className = `log-entry log-${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      consoleDiv.appendChild(entry);
      consoleDiv.scrollTop = consoleDiv.scrollHeight;
      originalLog(`[TAM-DEBUG] ${message}`);
    }

    console.log = (...args) => addLog(args.join(' '), 'info');
    console.error = (...args) => addLog(args.join(' '), 'error');
    console.warn = (...args) => addLog(args.join(' '), 'warn');

    // Mock Home Assistant object
    const mockHass = {
      states: {},
      entities: {},
      devices: {},
      areas: {},
      services: {},
      config: {
        latitude: 43.61,
        longitude: 3.88,
        elevation: 50,
        unit_system: {
          length: 'km',
          mass: 'kg',
          temperature: '°C',
          volume: 'L',
        },
        time_zone: 'Europe/Paris',
        components: [],
        version: '2023.1.0',
      },
      localize: () => '',
      locale: {
        language: 'fr',
        country: 'FR',
      },
      call_service: () => {},
    };

    let tamCardLoaded = false;
    let availableStops = [];
    let availableDirections = [];

    // Save API configuration
    document.getElementById('save-config-btn').addEventListener('click', () => {
      apiHost = document.getElementById('api-host').value;
      if (!apiHost.trim()) {
        addLog('❌ API Host cannot be empty', 'error');
        return;
      }
      localStorage.setItem('tamCardApiHost', apiHost);
      addLog(`✅ API Host saved: ${apiHost}`, 'success');
    });

    // Load the card and test
    async function init() {
      try {
        addLog('📦 Loading tam-card.js...', 'info');
        
        // Wait for custom element to be registered
        addLog('⏳ Waiting 3 seconds for custom element registration...', 'info');
        await new Promise(resolve => setTimeout(resolve, 3000));
        
        try {
          // Check if tam-card is registered
          const tamCardElement = customElements.get('tam-card');
          if (tamCardElement) {
            addLog('✅ tam-card custom element registered!', 'success');
            addLog(`Element class: ${tamCardElement.name}`, 'info');
            tamCardLoaded = true;
            document.getElementById('load-status').innerHTML = '<span class="success">✅ tam-card ready!</span>';
            
            // Enable render button
            document.getElementById('render-card-btn').disabled = false;
            document.getElementById('render-card-btn').textContent = 'Render Card';
          } else {
            addLog('❌ tam-card custom element not registered after 3 seconds', 'error');
            document.getElementById('load-status').innerHTML = '<span class="error">❌ Failed to register tam-card</span>';
          }
        } catch (e) {
          addLog(`⚠️ Error checking element: ${e.message}`, 'warn');
        }
      } catch (e) {
        addLog(`Error: ${e.message}`, 'error');
      }
    }

    async function testStopsApi() {
      try {
        addLog('🌐 Testing /api/v1/realtime/stops...', 'info');
        const url = `${apiHost}/api/v1/realtime/stops`;
        addLog(`📍 Requesting: ${url}`, 'info');
        
        const response = await fetch(url, {
          method: 'GET',
          headers: {
            'Accept': 'application/json',
          },
        });
        
        if (!response.ok) {
          addLog(`❌ API Error: ${response.status} ${response.statusText}`, 'error');
          document.getElementById('api-result').innerHTML = `<span class="error">❌ API Error: ${response.status} ${response.statusText}</span>`;
          return;
        }
        
        const data = await response.json();
        addLog(`✅ Stops API working!`, 'success');
        
        if (Array.isArray(data)) {
          addLog(`✅ Received ${data.length} stops`, 'success');
          addLog(`Sample stops: ${data.slice(0, 3).join(', ')}`, 'info');
          availableStops = data;
          populateStopsDropdown(data);
          document.getElementById('api-result').innerHTML = `<span class="success">✅ API working! Stops received: ${data.length}</span>`;
        } else {
          addLog(`⚠️ Unexpected response format: ${JSON.stringify(data).substring(0, 100)}`, 'warn');
        }
      } catch (e) {
        addLog(`❌ API Error: ${e.message}`, 'error');
        document.getElementById('api-result').innerHTML = `<span class="error">❌ Error: ${e.message}</span>`;
      }
    }

    async function testPassagesApi() {
      try {
        const stopSelect = document.getElementById('stops-select');
        const stop = stopSelect.value;

        if (!stop) {
          addLog('⚠️ Please select a stop first', 'warn');
          return;
        }

        addLog(`🌐 Testing /api/v1/realtime/passages for stop: ${stop}...`, 'info');
        const url = `${apiHost}/api/v1/realtime/passages?stop_name=${encodeURIComponent(stop)}&limit=5`;
        addLog(`📍 Requesting: ${url}`, 'info');
        
        const response = await fetch(url, {
          method: 'GET',
          headers: {
            'Accept': 'application/json',
          },
        });
        
        if (!response.ok) {
          addLog(`❌ API Error: ${response.status} ${response.statusText}`, 'error');
          document.getElementById('api-result').innerHTML = `<span class="error">❌ API Error: ${response.status} ${response.statusText}</span>`;
          return;
        }
        
        const data = await response.json();
        addLog(`✅ Passages API working!`, 'success');
        
        if (Array.isArray(data)) {
          addLog(`✅ Received ${data.length} passages`, 'success');
          addLog(`Response: ${JSON.stringify(data, null, 2).substring(0, 200)}...`, 'info');
          
          // Extract unique directions
          const directions = [...new Set(data.map(p => p.trip_headsign || p.direction))].filter(Boolean);
          if (directions.length > 0) {
            availableDirections = directions;
            populateDirectionsDropdown(directions);
            addLog(`Found ${directions.length} unique directions`, 'success');
          }
          
          document.getElementById('api-result').innerHTML = `<span class="success">✅ API working! Passages received: ${data.length}</span>`;
        } else {
          addLog(`⚠️ Unexpected response format`, 'warn');
        }
      } catch (e) {
        addLog(`❌ API Error: ${e.message}`, 'error');
        document.getElementById('api-result').innerHTML = `<span class="error">❌ Error: ${e.message}</span>`;
      }
    }

    function populateStopsDropdown(stops) {
      const select = document.getElementById('stops-select');
      select.innerHTML = '<option value="">-- Select a stop --</option>';
      stops.forEach(stop => {
        const option = document.createElement('option');
        option.value = stop;
        option.textContent = stop;
        select.appendChild(option);
      });
      select.disabled = false;
      addLog(`✅ Stops dropdown populated with ${stops.length} stops`, 'success');
    }

    function populateDirectionsDropdown(directions) {
      const select = document.getElementById('directions-select');
      select.innerHTML = '<option value="">-- Select a direction --</option>';
      directions.forEach(direction => {
        const option = document.createElement('option');
        option.value = direction;
        option.textContent = direction;
        select.appendChild(option);
      });
      select.disabled = false;
      addLog(`✅ Directions dropdown populated with ${directions.length} directions`, 'success');
    }

    function renderCard() {
      try {
        if (!tamCardLoaded) {
          addLog('❌ tam-card is not loaded yet.', 'error');
          return;
        }

        const stopSelect = document.getElementById('stops-select');
        const directionSelect = document.getElementById('directions-select');
        const stop = stopSelect.value;
        const direction = directionSelect.value;

        if (!stop || !direction) {
          addLog('⚠️ Please select both a stop and direction', 'warn');
          return;
        }

        addLog('🎨 Attempting to render tam-card...', 'info');
        
        const container = document.getElementById('card-container');
        container.innerHTML = '';

        // Create the tam-card element
        const card = document.createElement('tam-card');
        
        // Set config with API host
        const config = {
          type: 'custom:tam-card',
          stop: stop,
          direction: direction,
          api_host: apiHost,
          backgroundColor: 'auto',
          textColor: 'auto',
        };
        
        addLog(`Setting card config: stop=${config.stop}, direction=${config.direction}, api_host=${config.api_host}`, 'info');
        
        // Set the hass property
        card.hass = mockHass;
        addLog('✅ hass property set', 'success');
        
        // Append to DOM
        container.appendChild(card);
        addLog('✅ Card appended to DOM', 'success');

        // Call setConfig
        if (typeof card.setConfig === 'function') {
          addLog('⏳ Calling setConfig...', 'info');
          card.setConfig(config).then(() => {
            addLog('✅ setConfig completed', 'success');
          }).catch(err => {
            addLog(`❌ setConfig error: ${err.message}`, 'error');
          });
        } else {
          addLog('❌ setConfig method not found on element', 'error');
        }

      } catch (e) {
        addLog(`❌ Error rendering card: ${e.message}`, 'error');
        document.getElementById('card-container').innerHTML = `<span class="error">Error: ${e.message}</span>`;
      }
    }

    document.getElementById('test-stops-btn').addEventListener('click', testStopsApi);
    document.getElementById('test-passages-btn').addEventListener('click', testPassagesApi);
    document.getElementById('render-card-btn').addEventListener('click', renderCard);
    
    document.getElementById('stops-select').addEventListener('change', () => {
      document.getElementById('directions-select').innerHTML = '<option value="">Loading directions...</option>';
      document.getElementById('directions-select').disabled = true;
      // Optionally auto-fetch directions when stop changes
      setTimeout(() => testPassagesApi(), 500);
    });

    addLog('🚀 Initializing TAM Card Debugger (API Version)...', 'info');
    addLog(`Using API Host: ${apiHost}`, 'info');
    init();
  </script>
</body>
</html>
