name: Release

on:
    push:
        tags:
            - 'v*'

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '18'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build project
              run: npm run build

            - name: Upload release asset
              uses: softprops/action-gh-release@v1
              with:
                  files: dist/tam-card.js
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
